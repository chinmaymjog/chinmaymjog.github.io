baseURL: https://chinmaymjog.github.io/
languageCode: en-us
title: Chinmay Jog
theme: PaperMod
paginate: 10

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

googleAnalytics: ""

minify:
  disableXML: true

outputs:
  home:
    - HTML
    - RSS
    - JSON

params:
  env: production
  description: "Platform & Cloud Solutions Architect - notes on Kubernetes, Terraform, Azure, and building golden paths for developers."
  author: Chinmay Jog
  defaultTheme: auto
  disableThemeToggle: false
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: false
  ShowRssButtonInSectionTermList: true
  ShowToc: true
  TocOpen: false
  comments: false
  hidemeta: false
  hideSummary: false

  homeInfoParams:
    Title: "Hi, I'm Chinmay Jog \U0001F44B"
    Content: >
      Platform & Cloud Solutions Architect with 20+ years bridging legacy
      infrastructure and cloud-native ecosystems. I write about Kubernetes,
      Terraform, Azure, and building golden paths for developers - mostly
      notes from things I've actually built.

  socialIcons:
    - name: github
      url: "https://github.com/chinmaymjog"
    - name: linkedin
      url: "https://www.linkedin.com/in/28051984-chinmay-jog/"
    - name: medium
      url: "https://medium.com/@chinmaymjog"
    - name: rss
      url: "index.xml"

  assets:
    disableHLJS: true

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]

menu:
  main:
    - identifier: posts
      name: Posts
      url: /posts/
      weight: 10
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 20
    - identifier: about
      name: About
      url: /about/
      weight: 30
    - identifier: search
      name: Search
      url: /search/
      weight: 40

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: true
    lineNos: false
    style: monokai

privacy:
  vimeo:
    disabled: false
    simple: true
  x:
    disabled: false
    enableDNT: true
    simple: true
  instagram:
    disabled: false
    simple: true
  youtube:
    disabled: false
    privacyEnhanced: true
