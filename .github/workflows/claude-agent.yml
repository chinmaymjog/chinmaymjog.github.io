name: Claude agent

# Runs Claude only when the repo owner mentions @claude. Claude proposes
# changes as branches/PRs; a human must review and merge. Merging to main
# deploys the site, so nothing here publishes without the owner's review.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

permissions: {}

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      github.actor == 'chinmaymjog' && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: agent
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    env:
      HUGO_VERSION: 0.160.0
      # SHA-256 of hugo_extended_<version>_linux-amd64.deb; keep in sync with deploy.yml.
      HUGO_SHA256: f84c6b2aacc3b0ab633a826dd5e6f08e054a59ead33f4f150567cadfea226c46
    steps:
      - name: Install Hugo
        run: |
          curl -fsSL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb" -o hugo.deb
          echo "${HUGO_SHA256}  hugo.deb" | sha256sum -c -
          sudo dpkg -i hugo.deb
          rm hugo.deb
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false
      - uses: anthropics/claude-code-action@c84e279f859e2591391e95bd309286eb111c345f # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 30
            --allowedTools "Bash(hugo --gc:*)"
