name: End-to-end

# Builds the site exactly as deploy.yml does (pinned Hugo, theme submodule) on
# every relevant pull request, which the deploy workflow does not, and checks
# the output with scripts/check-site.py: key pages exist and every internal
# link and asset resolves. No secrets, nothing is deployed. Not a required
# check: path-filtered on PRs.
on:
  pull_request:
    paths:
      - content/**
      - layouts/**
      - assets/**
      - static/**
      - data/**
      - i18n/**
      - archetypes/**
      - hugo.yaml
      - themes/**
      - .gitmodules
      - scripts/check-site.py
      - .github/workflows/e2e.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    name: Build and link check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Keep in sync with deploy.yml.
      HUGO_VERSION: 0.160.0
      HUGO_SHA256: f84c6b2aacc3b0ab633a826dd5e6f08e054a59ead33f4f150567cadfea226c46
    steps:
      - name: Install Hugo
        run: |
          curl -fsSL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb" -o hugo.deb
          echo "${HUGO_SHA256}  hugo.deb" | sha256sum -c -
          sudo dpkg -i hugo.deb
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - name: Build
        run: hugo --gc --minify --baseURL "http://localhost/"
      - name: Check site
        run: python3 scripts/check-site.py public http://localhost/
